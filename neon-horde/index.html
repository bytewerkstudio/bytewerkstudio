<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="NEON HORDE — Auto-Aim wave shooter. Buy weapons, upgrade them, survive endless waves. One file, no assets, by Bytewerk Studio.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NEON HORDE — Bytewerk Studio">
  <meta property="og:description" content="Kauf die Waffe. Level sie hoch. Noch eine Welle. — Auto-Aim-Wave-Shooter: 10 Waffen, Endlos-Wellen, Bosse, Prestige. Komplett im Browser, ohne Assets.">
  <meta property="og:url" content="https://bytewerkstudio.github.io/neon-horde/">
  <meta name="theme-color" content="#0a0f16">
  <title>NEON HORDE — Bytewerk Studio</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-7GlQawMMGgfgxNSLKM/pcQyuqrQ1PQSPysW57Z69G94='; style-src 'self' 'sha256-CA8AzWouo4stcdc5pdcIGTrD1v0zXO4n8sMLSFB5W10='; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>if(window.top!==window.self){try{window.top.location=window.self.location}catch(e){document.documentElement.hidden=true}}</script>
  <style>
    /* Boot-Basis: Module (ui.js) injizieren ihr Theme per NH.css.add() */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0a0f16; overflow: hidden; overscroll-behavior: none;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #game-canvas {
      display: block; background: #0a0f16;
      width: 100vw; height: 100vh;
      width: min(100vw, 177.78vh); /* aspect 16:9 fit */
      height: min(100vh, 56.25vw);
      image-rendering: auto; touch-action: none;
    }
    #nh-bootline { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
      color: #5b6b80; font-size: 13px; letter-spacing: 1px; font-family: monospace; }
    #nh-error {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(4,8,14,0.97); z-index: 99999; color: #ff6b6b; font-family: monospace;
      padding: 24px; text-align: center; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
  </div>
  <div id="nh-bootline"></div>
  <div id="nh-error"></div>

  <!-- Lade-Reihenfolge: Basis -> Daten -> Vertrag -> Module -> Boot -->
  <script src="src/loader.js"></script>
  <script src="src/balance.js"></script>
  <script src="src/api.js"></script>
  <script src="src/lang.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/save.js"></script>
  <script src="src/meta.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/weapons.js"></script>
  <script src="src/waves.js"></script>
  <script src="src/shop.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
