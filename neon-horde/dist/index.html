/* ==== src/loader.js (5.1 KB) ==== */
/* ============================================================
 * NEON HORDE — Bytewerk Studio
 * loader.js — NH Namespace, Utilities, Event-Bus, i18n, DOM, CSS
 * Lade-Reihenfolge: loader -> balance -> lang -> audio -> input
 *                   -> meta -> save -> entities -> weapons
 *                   -> waves -> shop -> ui -> game -> main
 * ============================================================ */
(function () {
  'use strict';
  const NH = (window.NH = window.NH || {});

  /* ---------- Utilities ---------- */
  NH.u = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a, b) => a + Math.random() * (b - a),
    randi: (a, b) => Math.floor(NH.u.rand(a, b + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    dist2: (ax, ay, bx, by) => {
      const dx = ax - bx, dy = ay - by;
      return dx * dx + dy * dy;
    },
    dist: (ax, ay, bx, by) => Math.sqrt(NH.u.dist2(ax, ay, bx, by)),
    angleTo: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
    fmt: (n) => {
      n = Math.round(n);
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 10000) return (n / 1000).toFixed(1) + 'K';
      return String(n);
    },
    fmtClock: (s) => {
      s = Math.max(0, Math.ceil(s));
      const m = Math.floor(s / 60), ss = s % 60;
      return m + ':' + (ss < 10 ? '0' : '') + ss;
    },
    keyOf: (o) => Object.keys(o)[0],
  };

  /* ---------- Event Bus ---------- */
  NH.events = {
    _m: Object.create(null),
    on(evt, fn) {
      (this._m[evt] = this._m[evt] || []).push(fn);
      return fn;
    },
    off(evt, fn) {
      const a = this._m[evt];
      if (a) {
        const i = a.indexOf(fn);
        if (i >= 0) a.splice(i, 1);
      }
    },
    emit(evt, data) {
      const a = this._m[evt];
      if (a) for (let i = 0; i < a.length; i++) { try { a[i](data); } catch (e) { console.error('[NH:events:' + evt + ']', e); } }
    },
  };

  /* ---------- i18n ---------- */
  NH.lang = {
    current: (typeof navigator !== 'undefined' && navigator.language && navigator.language.toLowerCase().indexOf('de') === 0) ? 'de' : 'en',
    de: {},
    en: {},
    set(l) {
      this.current = l === 'de' ? 'de' : 'en';
      NH.events.emit('lang', l);
      NH.events.emit('nh:lang', l); // Vertragskanal; 'lang' bleibt Legacy
    },
    t(path) {
      const parts = path.split('.');
      const ns = parts[0];
      const key = parts.slice(1).join('.');
      const table = (this[this.current] && this[this.current][ns]) || {};
      let v = table[key];
      if (v === undefined) {
        const enTable = (this.en && this.en[ns]) || {};
        v = enTable[key];
        if (v === undefined) return path;
      }
      return v;
    },
  };
  NH.t = (p) => NH.lang.t(p);

  /* ---------- DOM helpers ---------- */
  NH.dom = {
    el(tag, attrs, children) {
      const n = document.createElement(tag);
      if (attrs) {
        for (const k in attrs) {
          const v = attrs[k];
          if (v === undefined || v === null) continue;
          if (k === 'class') n.className = v;
          else if (k === 'text') n.textContent = v;
          else if (k === 'html') n.innerHTML = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
          else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
          else if (k === 'dataset') Object.assign(n.dataset, v);
          else n.setAttribute(k, v);
        }
      }
      if (children !== undefined && children !== null) {
        if (typeof children === 'string' || typeof children === 'number') n.textContent = String(children);
        else if (Array.isArray(children)) for (const c of children) if (c) n.appendChild(c);
        else n.appendChild(children);
      }
      return n;
    },
    div(children, cls) {
      return NH.dom.el('div', cls ? { class: cls } : null, children);
    },
    button(label, cls, onClick) {
      const b = NH.dom.el('button', { class: cls || 'nh-btn' }, label);
      if (onClick) b.addEventListener('click', onClick);
      return b;
    },
    clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    },
    show(node) { node.classList.remove('nh-hidden'); },
    hide(node) { node.classList.add('nh-hidden'); },
    $(sel) { return document.querySelector(sel); },
    $all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); },
  };

  /* ---------- CSS injection (gathers module styles into one tag) ---------- */
  NH.css = {
    _styles: [],
    add(cssText) {
      this._styles.push(cssText);
      let tag = NH.dom.$('#nh-styles');
      if (tag && typeof tag.appendChild !== 'function') tag = null;
      if (!tag) {
        tag = document.createElement('style');
        tag.id = 'nh-styles';
        (document.head || document.documentElement).appendChild(tag);
      }
      tag.appendChild(document.createTextNode(cssText));
    },
    all() { return this._styles.join('\n'); },
  };

  /* ---------- Log ---------- */
  NH.log = (...a) => console.log('[NH]', ...a);
})();

/* ==== src/audio.js (16.6 KB) ==== */
/* ============================================================
 * NEON HORDE — Bytewerk Studio
 * audio.js — WebAudio-Synth-Sound (keine externen Dateien)
 *
 * Vertrag (api.js):
 *   NH.audio.unlock()        erzeugt/resumt AudioContext (User-Geste, iOS)
 *   NH.audio.sfx(name,opts)  synth-SFX (25 Namen + bgm Drone)
 *   NH.audio.setVolume(v)    0..1
 *   NH.audio.enabled         bool, prüft save.data.settings.sound
 *
 * Design: Der Audio-Kern ist komplett lazy — beim Skript-Laden wird
 * nichts erstellt und nichts gespielt. Alles läuft hinter try/catch;
 * ohne AudioContext oder vor dem ersten Unlock ist jedes Modul ein
 * stiller No-Op, der nie wirft.
 * Juice: Jede Waffe hat einen eigenen Klangcharakter, alle Schüsse
 * erhalten zufällige Pitch-Variation, der kill-Sound steigt mit der
 * Combo.
 * ============================================================ */
(function () {
  'use strict';
  const NH = (window.NH = window.NH || {});

  const A = {};
  let ctx = null;       // AudioContext (lazy, erst in unlock())
  let master = null;    // Master-Gain -> destination = 0.8 * Nutzer-Lautstärke
  let noiseBuf = null;  // 0.5 s weißes Rauschen (gefiltert für Percussion)
  let vol = 1;          // Nutzer-Lautstärke 0..1
  let sfxScale = 1;     // optionale Einzel-Lautstärke (opts.vol)
  let drone = null;     // laufender BGM-Drone {o1, o2, g}
  let unlocked = false; // erste User-Geste registriert

  /* ---------- Kern ---------- */

  function ensureCtx() {
    if (ctx) return ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.8; // Vertrag: masterGain 0.8
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) {
      ctx = null; master = null; noiseBuf = null;
    }
    return ctx;
  }

  // Nur spielen, wenn ein laufender Context existiert (iOS: erst nach unlock)
  function ready() {
    return !!(ctx && master && ctx.state === 'running');
  }

  function applyMaster() {
    if (!master || !ctx) return;
    try { master.gain.setTargetAtTime(0.8 * vol, ctx.currentTime, 0.02); }
    catch (e) { master.gain.value = 0.8 * vol; }
  }

  // Hüllkurve: 0.0001 -> peak (Attack) -> 0.0001 (Decay), exp. — klickfrei
  function env(g, t0, peak, atk, dec) {
    peak = Math.max(0.0001, peak);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + Math.max(0.001, atk));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(0.02, dec));
  }

  function tone(o) {
    // o: {type, f0, f1?, slideT?, t0, dur, vol, atk?, dec?, detune?}
    if (!ready()) return;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    const f0 = Math.max(20, o.f0 || 220);
    const f1 = Math.max(20, o.f1 !== undefined ? o.f1 : f0);
    osc.frequency.setValueAtTime(f0, o.t0);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, o.t0 + (o.slideT || o.dur));
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();
    env(g, o.t0, (o.vol || 0.08) * sfxScale, o.atk !== undefined ? o.atk : 0.004, o.dec !== undefined ? o.dec : o.dur);
    osc.connect(g); g.connect(master);
    osc.start(o.t0);
    osc.stop(o.t0 + o.dur + 0.1);
    osc.onended = function () {
      try { osc.disconnect(); g.disconnect(); } catch (e) {}
    };
  }

  function noise(o) {
    // o: {t0, dur, vol, atk?, dec?, freq?, freq1?, filter?, q?}
    if (!ready() || !noiseBuf) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    let node = src;
    if (o.freq || o.freq1) {
      const f = ctx.createBiquadFilter();
      f.type = o.filter || 'lowpass';
      f.Q.value = o.q || 0.8;
      f.frequency.setValueAtTime(o.freq || 1000, o.t0);
      if (o.freq1) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.freq1), o.t0 + o.dur);
      src.connect(f); node = f;
    }
    const g = ctx.createGain();
    env(g, o.t0, (o.vol || 0.06) * sfxScale, o.atk !== undefined ? o.atk : 0.005, o.dec !== undefined ? o.dec : o.dur);
    node.connect(g); g.connect(master);
    src.start(o.t0);
    src.stop(o.t0 + o.dur + 0.1);
    src.onended = function () {
      try { src.disconnect(); g.disconnect(); } catch (e) {}
    };
  }

  // Pitch-Variation: zufällig +/- cents (jeder Schuss klingt anders)
  function pv(f, cents) {
    return f * Math.pow(2, (Math.random() * 2 - 1) * cents / 1200);
  }

  /* ---------- BGM: optionaler Drone-Layer (2 detuned Osc, sehr leise) ---------- */

  function startDrone() {
    if (drone || !ready()) return; // nur bei aktivem AudioContext
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.5); // weiches Einschweben
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 220; f.Q.value = 0.4;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    o1.type = 'sawtooth'; o1.frequency.value = 55; o1.detune.value = -9;
    o2.type = 'sawtooth'; o2.frequency.value = 55; o2.detune.value = 9;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
    o1.start(); o2.start();
    drone = { o1: o1, o2: o2, g: g };
  }

  function stopDrone() {
    if (!drone) return;
    const d = drone; drone = null;
    try {
      d.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.3);
      const at = ctx.currentTime + 1.2;
      d.o1.stop(at); d.o2.stop(at);
      d.o1.onended = function () { try { d.o1.disconnect(); } catch (e) {} };
      d.o2.onended = function () { try { d.o2.disconnect(); } catch (e) {} };
    } catch (e) {}
  }

  /* ---------- Sound-Table: alle Vertragsnamen ---------- */

  const SOUNDS = {
    // Blaster: kerniger square-Pew mit harmonischem Körper
    shoot_blaster: function (o, t) {
      const f = pv(430, 60);
      tone({ type: 'square', f0: f, f1: f * 0.42, t0: t, dur: 0.10, vol: 0.09, atk: 0.003, dec: 0.09 });
      tone({ type: 'sine', f0: f * 0.5, f1: f * 0.22, t0: t, dur: 0.08, vol: 0.08, atk: 0.003, dec: 0.07 });
    },
    // Scattergun: dumpfer Chunk + Noise-Puff (5 Kugeln wirken als ein Schlag)
    shoot_scattergun: function (o, t) {
      const f = pv(240, 80);
      tone({ type: 'square', f0: f, f1: f * 0.55, t0: t, dur: 0.13, vol: 0.10, atk: 0.002, dec: 0.12 });
      noise({ t0: t, dur: 0.12, vol: 0.07, atk: 0.002, dec: 0.11, freq: 1600, freq1: 300 });
    },
    // Piercer: schneller, hoher Sawtooth-Zing
    shoot_piercer: function (o, t) {
      const f = pv(980, 80);
      tone({ type: 'sawtooth', f0: f, f1: f * 0.35, t0: t, dur: 0.16, vol: 0.07, atk: 0.004, dec: 0.14 });
      tone({ type: 'sine', f0: f * 1.5, f1: f * 0.5, t0: t, dur: 0.10, vol: 0.05, atk: 0.004, dec: 0.08 });
    },
    // Chainbolt: elektrischer Doppel-Zap + bandgefiltertes Knistern
    shoot_chainbolt: function (o, t) {
      const f = pv(1300, 150);
      tone({ type: 'square', f0: f, f1: f * 0.3, t0: t, dur: 0.11, vol: 0.06, atk: 0.002, dec: 0.10 });
      tone({ type: 'sawtooth', f0: f * 1.3, f1: f * 0.25, t0: t + 0.02, dur: 0.12, vol: 0.05, atk: 0.002, dec: 0.11 });
      noise({ t0: t, dur: 0.09, vol: 0.05, freq: 3000, filter: 'bandpass', q: 6 });
    },
    // Triplaser: drei versetzte Strahlen als Akkord
    shoot_triplaser: function (o, t) {
      [1, 1.19, 1.42].forEach(function (m, i) {
        const f = pv(720 * m, 50);
        tone({ type: 'sine', f0: f, f1: f * 0.5, t0: t + i * 0.025, dur: 0.10, vol: 0.06, atk: 0.003, dec: 0.08 });
      });
    },
    // Nova: tiefer Sine-Boom + Noise-Explosion
    shoot_nova: function (o, t) {
      tone({ type: 'sine', f0: pv(300, 50), f1: 70, t0: t, dur: 0.35, vol: 0.12, atk: 0.008, dec: 0.32 });
      noise({ t0: t, dur: 0.32, vol: 0.08, atk: 0.008, dec: 0.30, freq: 900, freq1: 120 });
      tone({ type: 'triangle', f0: 160, f1: 60, t0: t, dur: 0.30, vol: 0.08, atk: 0.005, dec: 0.28 });
    },
    // Tesla: Absetzdrohne + heller Zap
    shoot_tesla: function (o, t) {
      tone({ type: 'sine', f0: pv(90, 40), f1: 55, t0: t, dur: 0.22, vol: 0.09, atk: 0.02, dec: 0.20 });
      tone({ type: 'square', f0: pv(1400, 200), f1: 200, t0: t + 0.06, dur: 0.14, vol: 0.05, atk: 0.002, dec: 0.12 });
      noise({ t0: t + 0.05, dur: 0.12, vol: 0.05, freq: 2500, filter: 'bandpass', q: 4 });
    },
    // Flamer: Rausch-Whoosh (fällt ab) + tiefes Sägen
    shoot_flamer: function (o, t) {
      noise({ t0: t, dur: 0.28, vol: 0.08, atk: 0.01, dec: 0.25, freq: 1400, freq1: 300 });
      tone({ type: 'sawtooth', f0: pv(160, 50), f1: 70, t0: t, dur: 0.26, vol: 0.06, atk: 0.015, dec: 0.23 });
      noise({ t0: t + 0.05, dur: 0.20, vol: 0.05, freq: 500, filter: 'highpass', q: 1 });
    },
    // Mines: zwei kurze Pop-Ticks (Mine auswerfen)
    shoot_mines: function (o, t) {
      const f = pv(340, 90);
      tone({ type: 'square', f0: f, f1: f * 0.6, t0: t, dur: 0.09, vol: 0.08, atk: 0.002, dec: 0.08 });
      tone({ type: 'sine', f0: f * 0.5, f1: f * 0.25, t0: t + 0.05, dur: 0.08, vol: 0.06, atk: 0.002, dec: 0.07 });
    },
    // Railgun: massiver Noise-Slam + brüllender Sweep
    shoot_railgun: function (o, t) {
      noise({ t0: t, dur: 0.40, vol: 0.12, atk: 0.003, dec: 0.38, freq: 2400, freq1: 200 });
      tone({ type: 'sawtooth', f0: pv(900, 100), f1: 80, t0: t, dur: 0.34, vol: 0.09, atk: 0.003, dec: 0.31 });
      tone({ type: 'square', f0: 220, f1: 50, t0: t, dur: 0.20, vol: 0.09, atk: 0.002, dec: 0.18 });
    },
    // Kill: Knall; Grundton steigt mit der Combo (opts.combo)
    kill: function (o, t) {
      const c = Math.min((o.combo || 0), 40);
      const f = pv(260 + c * 7, 60);
      tone({ type: 'square', f0: f, f1: f * 0.3, t0: t, dur: 0.16, vol: 0.11, atk: 0.002, dec: 0.14 });
      noise({ t0: t, dur: 0.12, vol: 0.07, freq: 1200, freq1: 250 });
      tone({ type: 'sine', f0: f * 0.55, f1: f * 0.18, t0: t + 0.02, dur: 0.14, vol: 0.08, atk: 0.002, dec: 0.12 });
    },
    // Hit: kurzer, spitzer Tick
    hit: function (o, t) {

/* ============================================================
 * NEON HORDE — Bytewerk Studio
 * input.js — Steuerung Desktop (Tastatur/Maus) + Touch (Joystick)
 * Vertrag: api.js. Listen werden bei init() gesetzt (nie beim Laden).
 * WASD/Pfeile -> axis, Touch links -> Joystick, Maus/Touch rechts
 * -> pointer (Canvas-Logik-Koordinaten). Aktionen -> 'nh:key'.
 * Deadzone/Joystick-Radius sind Eingabe-Feeling, keine Balance.
 * coordinates IMMER Logik-Auflösung (1280x720); Skalierung via CSS.
 * ============================================================ */
(function () {
  'use strict';
  const NH = (window.NH = window.NH || {});

  /* ---------- Zustand (dt-unabhängig, wird ereignisgetrieben aktualisiert) ---------- */
  const keys = new Set();                  // gedrückte e.code (KeyW, ArrowUp, ...)
  const axis = { x: 0, y: 0 };             // kombiniert Tastatur + Joystick, Komponenten -1..1
  const pointer = { x: 0, y: 0, active: false }; // Logik-Koordinaten; active = Maus gedrückt / Touch rechts
  const ACTION_CODES = new Set(['KeyP', 'KeyE', 'Space', 'Digit1', 'Digit2', 'Digit3', 'Enter']);
  const SCROLL_CODES = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
  const JOY_MAX = 60;   // px: Joystick-Vollausschlag
  const JOY_DEAD = 12;  // px: Totzone, verhindert Zittern

  let canvas = null;
  let joyId = null;              // pointerId des Joystick-Fingers
  let joy = null;                // {ox,oy,x,y} in Logik-Koordinaten
  const ptrs = new Map();        // pointerId -> {kind:'joy'|'ptr'} für Multi-Touch
  let unlocked = false;          // Audio-Unlock einmalig

  /* ---------- Helfer ---------- */
  function typingTarget(t) {
    return !!(t && ((t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') || t.isContentEditable));
  }
  function interactiveTarget(t) {
    return !!(t && t.closest && t.closest('input, textarea, select, button, a[href], [tabindex]'));
  }
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: NH.u.clamp((e.clientX - r.left) * (canvas.width / r.width), 0, canvas.width),
      y: NH.u.clamp((e.clientY - r.top) * (canvas.height / r.height), 0, canvas.height),
    };
  }
  function unlockAudio() {
    if (unlocked) return;
    unlocked = true;
    if (NH.audio && typeof NH.audio.unlock === 'function') NH.audio.unlock();
    NH.events.emit('nh:audioUnlock');
  }
  function recomputeAxis() {
    let x = 0, y = 0;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
    if (joy) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy;
      const d = Math.hypot(dx, dy);
      if (d > JOY_DEAD) {
        const t = Math.min(1, (d - JOY_DEAD) / (JOY_MAX - JOY_DEAD)); // 0..1, Deadzone-Rampe
        x += (dx / d) * t;
        y += (dy / d) * t;
      }
    }
    axis.x = NH.u.clamp(x, -1, 1);
    axis.y = NH.u.clamp(y, -1, 1);
  }

    // Fokusverlust/Tab-Hidden: nichts hängen lassen
    keys.clear();
    ptrs.clear();
    joyId = null;
    joy = null;
    pointer.active = false;
    recomputeAxis();
  }
  function hasPtr() {
    for (const r of ptrs.values()) if (r.kind === 'ptr') return true;
    return false;
  }

  /* ---------- Tastatur (window: unabhängig vom Fokuselement) ---------- */
  function onKeyDown(e) {
    if (typingTarget(e.target)) return;              // Textfelder frei lassen
    if (e.ctrlKey || e.metaKey || e.altKey) return;  // Browser-Shortcuts nicht blockieren
    const code = e.code;
    // Fokussierter Button behält Space/Enter (Accessibility, kein Doppel-Trigger)
    if (interactiveTarget(e.target) && (code === 'Space' || code === 'Enter')) return;
    keys.add(code);
    if (!e.repeat) {
      unlockAudio();
      if (ACTION_CODES.has(code)) NH.events.emit('nh:key', { code });
    }
    if (SCROLL_CODES.has(code)) e.preventDefault(); // kein Seiten-Scrollen
    recomputeAxis();
  }
  function onKeyUp(e) {
    if (keys.delete(e.code)) recomputeAxis();
  }

  /* ---------- Zeiger: Maus überall -> pointer; Touch links -> Joystick, rechts -> pointer ---------- */
  function onPointerDown(e) {
    e.preventDefault(); // kein Scroll/Double-Tap-Zoom (touch-action: none zusätzlich in index.html)
    unlockAudio();
    const el = document.activeElement;
    if (el && el !== canvas && el.blur) el.blur(); // Space-Falle nach Button-Klick umgehen
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* Pointer evtl. schon weg */ }
    }
    const p = toLogical(e);
    const midX = (NH.game && NH.game.W) ? NH.game.W * 0.5 : canvas.width * 0.5;
    if (joyId === null && (e.pointerType === 'touch' || e.pointerType === 'pen') && p.x < midX) {
      joyId = e.pointerId;
      joy = { ox: p.x, oy: p.y, x: p.x, y: p.y };
      ptrs.set(e.pointerId, { kind: 'joy' });
    } else {
      pointer.x = p.x; pointer.y = p.y; pointer.active = true;
      ptrs.set(e.pointerId, { kind: 'ptr' });
    }
    recomputeAxis();
  }
  function onPointerMove(e) {
    e.preventDefault();
    const p = toLogical(e);
    const rec = ptrs.get(e.pointerId);
    if (rec) {
      if (rec.kind === 'joy') { joy.x = p.x; joy.y = p.y; }
      else { pointer.x = p.x; pointer.y = p.y; }
    } else if (e.pointerType === 'mouse') {
      pointer.x = p.x; pointer.y = p.y; // Hover hält Position frisch, active bleibt false
    }
    recomputeAxis();
  }
  function onPointerEnd(e) {
    const rec = ptrs.get(e.pointerId);
    if (!rec) return;
    ptrs.delete(e.pointerId);
    if (rec.kind === 'joy') { joyId = null; joy = null; }
    else if (!hasPtr()) pointer.active = false;
    recomputeAxis();
  }

  /* ---------- Öffentliche API (Vertrag api.js) ---------- */
  NH.input = {
    init(c) {
      if (canvas) { canvas = c; return; } // idempotent
      canvas = c;
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('blur', resetAll);                     // Fokusverlust
      document.addEventListener('visibilitychange', () => { if (document.hidden) resetAll(); });
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerEnd);            // Loslassen außerhalb Canvas
      window.addEventListener('pointercancel', onPointerEnd);
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    },
    keys,
    axis,
    pointer,
    /* any(): aktuell irgendeine Bewegung (Bewegungstaste, Joystick, Pointer) */
    any() {
      return keys.has('KeyW') || keys.has('KeyA') || keys.has('KeyS') || keys.has('KeyD') ||
        keys.has('ArrowUp') || keys.has('ArrowDown') || keys.has('ArrowLeft') || keys.has('ArrowRight') ||
        !!joy || pointer.active;
    },
  };
})();
